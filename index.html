<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>小小待办</title>
  <style>
    :root { font-family: system-ui, sans-serif; color: #253047; background: #f5f7fb; }
    * { box-sizing: border-box; }
    body { margin: 0; padding: 48px 16px; }
    main { max-width: 560px; margin: auto; padding: 28px; background: white; border-radius: 20px; box-shadow: 0 10px 35px #263c6314; }
    h1 { margin: 0 0 8px; font-size: 28px; }
    p { color: #64748b; }
    form { display: flex; gap: 8px; margin: 24px 0; }
    input { flex: 1; min-width: 0; padding: 12px; border: 1px solid #cbd5e1; border-radius: 9px; font: inherit; }
    button { border: 0; border-radius: 9px; padding: 11px 16px; background: #4263eb; color: white; font: inherit; cursor: pointer; }
    button:hover { background: #364fc7; }
    ul { list-style: none; padding: 0; margin: 0; }
    li { display: flex; align-items: center; gap: 12px; padding: 12px 0; border-top: 1px solid #e9edf3; }
    li span { flex: 1; overflow-wrap: anywhere; }
    li.done span { color: #94a3b8; text-decoration: line-through; }
    li button { background: #e9edf3; color: #475569; padding: 6px 10px; }
    li button:hover { background: #dbe2ec; }
    #empty { text-align: center; padding: 20px 0; }
  </style>
</head>
<body>
  <main>
    <h1>小小待办 ✅</h1>
    <p>记下今天想完成的事。内容保存在当前浏览器中。</p>
    <form id="form">
      <input id="new-task" aria-label="新待办" placeholder="例如：读书 20 分钟" maxlength="120" required>
      <button type="submit">添加</button>
    </form>
    <ul id="tasks" aria-label="待办列表"></ul>
    <p id="empty">还没有待办，添加第一件事吧。</p>
  </main>
  <script>
    const key = 'tiny-todos-v1';
    let tasks;
    try {
      const saved = JSON.parse(localStorage.getItem(key) || '[]');
      tasks = Array.isArray(saved) ? saved : [];
    } catch {
      tasks = [];
    }
    const list = document.querySelector('#tasks');
    const empty = document.querySelector('#empty');
    const input = document.querySelector('#new-task');
    function save() { localStorage.setItem(key, JSON.stringify(tasks)); }
    function render() {
      list.replaceChildren();
      empty.hidden = tasks.length > 0;
      tasks.forEach((task, index) => {
        const item = document.createElement('li');
        item.className = task.done ? 'done' : '';
        const check = document.createElement('input');
        check.type = 'checkbox';
        check.checked = task.done;
        check.setAttribute('aria-label', `完成：${task.text}`);
        check.addEventListener('change', () => { task.done = check.checked; save(); render(); });
        const label = document.createElement('span');
        label.textContent = task.text;
        const remove = document.createElement('button');
        remove.type = 'button';
        remove.textContent = '删除';
        remove.setAttribute('aria-label', `删除：${task.text}`);
        remove.addEventListener('click', () => { tasks.splice(index, 1); save(); render(); });
        item.append(check, label, remove);
        list.append(item);
      });
    }
    document.querySelector('#form').addEventListener('submit', event => {
      event.preventDefault();
      const text = input.value.trim();
      if (!text) return;
      tasks.push({ text, done: false });
      input.value = '';
      save();
      render();
      input.focus();
    });
    render();
  </script>
</body>
</html>
